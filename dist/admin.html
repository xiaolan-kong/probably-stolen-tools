<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>反馈后台 · 深空当铺工具站</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/feedback-pages.css"><script src="assets/theme.js"></script><script src="assets/feedback-config.js"></script><script defer src="assets/feedback-common.js"></script><script defer src="assets/feedback-admin.js"></script></head><body><main class="feedback-page"><a href="./">← 返回计算器</a><section class="feedback-card"><h1>反馈后台</h1><form id="admin-login"><label for="admin-email">管理员账号</label><input id="admin-email" type="email" autocomplete="username" required><label for="admin-password">密码</label><input id="admin-password" type="password" autocomplete="current-password" required><button class="primary" type="submit">登录</button></form><p id="admin-status" role="status"></p><section id="admin-workspace" hidden><div class="feedback-actions"><button id="reload-list">刷新列表</button><button id="admin-logout">退出登录</button></div><div class="admin-columns"><div><div id="ticket-list"></div><div class="feedback-actions"><button id="previous">上一页</button><button id="next">下一页</button></div></div><section><article id="ticket-detail"><p>选择一条反馈查看文字和截图。</p></article><form id="reply-form" hidden><label for="ticket-state">处理状态</label><select id="ticket-state"><option>待处理</option><option>处理中</option><option>已解决</option></select><label for="ticket-reply">回复玩家</label><textarea id="ticket-reply" maxlength="3000" rows="5"></textarea><button class="primary" type="submit">保存状态和回复</button></form></section></div></section></section></main></body></html>
